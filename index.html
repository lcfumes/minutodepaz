<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minuto de Paz</title>
    <style>
        :root {
            --bg-bible: #f7f4ea;
            --card-bg: #fffdf9;
            --text-main: #3b2f2f;
            --text-muted: #6b5b52;
            --accent-brown: #5a4a42;
            --accent-gold: #c29b38;
            --border-bible: #e6dec5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-bible);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .screen {
            background: var(--card-bg);
            border: 1px solid var(--border-bible);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(90, 74, 66, 0.08);
            max-width: 520px;
            width: 100%;
            text-align: center;
            position: absolute;
            opacity: 0;
            transform: translateY(12px) scale(0.98);
            pointer-events: none;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .screen.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            z-index: 10;
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 400;
            color: var(--accent-brown);
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .slogan {
            font-size: 1.15rem;
            color: var(--accent-brown);
            font-style: italic;
        }

        .btn-acao {
            background-color: var(--accent-brown);
            color: #fffdf9;
            border: none;
            padding: 14px 30px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 12px rgba(90, 74, 66, 0.15);
            margin-top: 10px;
        }

        .btn-acao:hover {
            background-color: #43352f;
            transform: translateY(-1px);
        }

        audio {
            width: 100%;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .texto-reflexao {
            max-height: 160px;
            overflow-y: auto;
            text-align: left;
            padding: 12px 15px;
            background: #fdfbf7;
            border-left: 3px solid var(--accent-gold);
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.95krem;
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .texto-reflexao.visible {
            display: block;
            opacity: 1;
        }

        footer {
            position: fixed;
            bottom: 15px;
            right: 25px;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-style: italic;
            opacity: 0.75;
        }
    </style>
</head>
<body>

    <!-- Tela 1: Splash / Boas-vindas -->
    <div id="tela-splash" class="screen active">
        <h1>Minuto de Paz</h1>
        <p class="slogan">Sua dose diária de paz e conhecimento do evangelho.</p>
    </div>

    <!-- Tela 2: Episódio de Hoje -->
    <div id="tela-hoje" class="screen">
        <h1>Episódio de Hoje</h1>
        <p id="tema-hoje" style="font-weight: 500; color: var(--accent-brown);"></p>
        
        <div id="bloco-texto" class="texto-reflexao"></div>

        <audio id="player-audio" controls>
            <source src="20260820174404.mp3" type="audio/mpeg">
            Seu navegador não suporta áudio.
        </audio>
        
        <div>
            <button class="btn-acao" onclick="iniciarEpisodio()">Ouvir Reflexão</button>
        </div>
    </div>

    <!-- Tela 3: Amanhã -->
    <div id="tela-amanha" class="screen">
        <h1>Até amanhã</h1>
        <p>No episódio de amanhã, falaremos sobre:</p>
        <p id="tema-amanha" style="font-weight: 600; color: var(--accent-brown); font-size: 1.1rem;"></p>
    </div>

    <footer>Este aplicativo é e sempre será grátis para sempre.</footer>

    <script>
        const dados = {
            "tema_hoje": "Vamos conversar sobre como encontrar descanso em meio ao peso do dia a dia.",
            "texto": "Sabe quando o cansaço bate forte? Tem uma parte da Bíblia onde Jesus diz algo muito simples: 'Venham a mim, todos que estão cansados e sobrecarregados, e eu lhes darei descanso.' Essa é uma frase muito potente. Se você parar para analisar, ir até Jesus é simplesmente fechar os olhos e ter um momento de reflexão... O peso começa a sair das costas e achamos soluções que nunca imaginávamos. Por mais que hoje esteja difícil, lembre-se: você não está sozinho. O mesmo Jesus que te pede pra descansar, caminha com você.",
            "tema_amanha": "Mateus 6 e o que Jesus disse sobre não andarmos ansiosos com o dia de amanhã."
        };

        document.getElementById('tema-hoje').innerText = dados.tema_hoje;
        document.getElementById('bloco-texto').innerText = dados.texto;
        document.getElementById('tema-amanha').innerText = dados.tema_amanha;

        const player = document.getElementById('player-audio');

        // Transição automática da Splash para a Tela de Hoje após 2.6 segundos
        setTimeout(() => {
            transicaoTelas('tela-splash', 'tela-hoje');
        }, 2600);

        function iniciarEpisodio() {
            const bloco = document.getElementById('bloco-texto');
            bloco.classList.add('visible');
            player.play().catch(e => console.log("Aguardando interação de áudio", e));
        }

        player.addEventListener('ended', () => {
            transicaoTelas('tela-hoje', 'tela-amanha');
        });

        function transicaoTelas(idEsconder, idMostrar) {
            const elEsconder = document.getElementById(idEsconder);
            const elMostrar = document.getElementById(idMostrar);

            elEsconder.classList.remove('active');
            
            setTimeout(() => {
                elMostrar.classList.add('active');
            }, 300);
        }
    </script>
</body>
</html>
