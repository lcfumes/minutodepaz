<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minuto de Paz</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            background: #fff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .visible {
            opacity: 1;
            z-index: 10;
        }
        .hidden {
            opacity: 0;
            z-index: -1;
            pointer-events: none;
        }
        h1 {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 20px;
            color: #555;
        }
        .fechamento {
            font-weight: 600;
            color: #27ae60;
            margin-top: 30px;
            font-size: 1.2rem;
        }
        .tema-destaque {
            font-weight: bold;
            color: #2980b9;
            font-size: 1.3rem;
            margin: 20px 0;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 20px;
        }
        button:hover {
            background-color: #2980b9;
        }
        audio {
            margin-top: 20px;
            width: 100%;
        }
        .gratis-texto {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #7f8c8d;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- Tela Inicial -->
    <div id="tela-inicio" class="container visible">
        <h1>Minuto de Paz</h1>
        <p>Pare um pouco, respire fundo e acalme o coração.</p>
        <button onclick="carregarReflexao()">Iniciar Reflexão</button>
    </div>

    <!-- Tela de Reflexão -->
    <div id="tela-reflexao" class="container hidden">
        <h1 id="titulo"></h1>
        <p id="texto"></p>
        
        <audio id="player-audio" controls>
            <source id="source-audio" src="" type="audio/mpeg">
            <track id="track-legenda" src="" kind="subtitles" srclang="pt-BR" label="Português" default>
        </audio>

        <p id="fechamento" class="fechamento"></p>
    </div>

    <!-- Tela de Amanhã -->
    <div id="tela-amanha" class="container hidden">
        <h1>O amanhã vai acontecer</h1>
        <p>Amanhã nós vamos conversar sobre:</p>
        <p id="tema-amanha" class="tema-destaque"></p>
        <button onclick="voltarInicio()">Voltar ao Início</button>
        
        <p class="gratis-texto">Este aplicativo é e sempre será grátis para sempre.</p>
    </div>

    <script>
        const bancoDeDadosJSON = {
          "reflexoes": [
            {
              "id": 1,
              "titulo": "Alívio e Descanso",
              "texto": "Sabe quando o cansaço bate forte? Tem uma parte da Bíblia onde Jesus diz algo muito simples: 'Venham a mim, todos que estão cansados e sobrecarregados, e eu lhes darei descanso.' Essa é uma frase muito potente. Se você parar para analisar, ir até Jesus é simplesmente você fechar o seu olho... ter um momento de reflexão sobre tudo o que está acontecendo. Nesse momento, você vai conversar com Ele, vai ter a sua reflexão... e com certeza o peso vai começar a sair das suas costas. Ou você vai começar a achar soluções para aquilo que nunca imaginava. Por isso a Bíblia traz textos tão emocionantes e incríveis. Um simples parágrafo diz algo tão grandioso. E eu sei que a vida cobra caro. Pode ser que você esteja cansado do ônibus lotado... ou esteja em casa, aflito, esperando uma porta de emprego abrir. O corpo dói e a mente não para. Mas, por mais que hoje esteja difícil, lembre-se: você não está sozinho. O mesmo Jesus que te pede pra descansar, caminha com você. Acalme o peito. Respire fundo. Entregue suas preocupações agora. Amanhã é um novo dia, o sol vai raiar de novo... e Deus está cuidando do seu caminho. Descanse o seu coração hoje. Vai ficar tudo bem.",
              "fechamento": "E lembre-se, o amanhã vai acontecer.",
              "arquivo_audio": "audios/20260820174404.mp3",
              "arquivo_legenda": "legendas/20260820174404.vtt",
              "tema_amanha": "Amanhã vamos conversar sobre Mateus 6 e o que Jesus disse sobre não andarmos ansiosos com o dia de amanhã."
            }
          ]
        };

        const player = document.getElementById('player-audio');

        player.addEventListener('ended', () => {
            alternarTelas('tela-reflexao', 'tela-amanha');
        });

        function carregarReflexao() {
            const reflexaoAtual = bancoDeDadosJSON.reflexoes[0];
            
            document.getElementById('titulo').innerText = reflexaoAtual.titulo;
            document.getElementById('texto').innerText = reflexaoAtual.texto;
            document.getElementById('fechamento').innerText = reflexaoAtual.fechamento;
            document.getElementById('tema-amanha').innerText = reflexaoAtual.tema_amanha;
            
            document.getElementById('source-audio').src = reflexaoAtual.arquivo_audio;
            document.getElementById('track-legenda').src = reflexaoAtual.arquivo_legenda;
            
            player.load();

            alternarTelas('tela-inicio', 'tela-reflexao');
        }

        function voltarInicio() {
            alternarTelas('tela-amanha', 'tela-inicio');
        }

        function alternarTelas(idEsconder, idMostrar) {
            const elEsconder = document.getElementById(idEsconder);
            const elMostrar = document.getElementById(idMostrar);

            elEsconder.classList.remove('visible');
            elEsconder.classList.add('hidden');
            
            setTimeout(() => {
                elMostrar.classList.remove('hidden');
                elMostrar.classList.add('visible');
            }, 500);
        }
    </script>
</body>
</html>
